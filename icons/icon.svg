<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="#4a90e2" stroke-width="4"/>
  
  <!-- Canvas "C" letter -->
  <text x="64" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">C</text>
  
  <!-- Enhancement sparkles -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.8"/>
  <circle cx="98" cy="30" r="2" fill="white" opacity="0.6"/>
  <circle cx="30" cy="98" r="2" fill="white" opacity="0.6"/>
  <circle cx="98" cy="98" r="3" fill="white" opacity="0.8"/>
  
  <!-- Dark mode indicator -->
  <circle cx="90" cy="40" r="8" fill="#2d2d2d" stroke="white" stroke-width="2"/>
  <circle cx="90" cy="40" r="4" fill="white"/>
</svg>
